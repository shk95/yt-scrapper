# Extends gitleaks' defaults rather than replacing them.
#
# The added rule is for WireGuard key material. Proton VPN's generator emits a
# .conf containing a PrivateKey, and this project renders derived copies of
# those configs at runtime — so the one mistake that would actually hurt is a
# `git add -A` that catches one. .gitignore covers the expected paths; this
# covers the unexpected ones.

title = "tubedepth"

[extend]
useDefault = true

[[rules]]
id = "wireguard-private-key"
description = "WireGuard PrivateKey or PresharedKey"
regex = '''(?im)^\s*(Private|Preshared)Key\s*=\s*[A-Za-z0-9+/]{42,43}='''
tags = ["key", "wireguard"]

  [rules.allowlist]
  description = "Fixtures use obviously fake keys so this stays a formality"
  paths = ['''tests/fixtures/egress/.*''']
