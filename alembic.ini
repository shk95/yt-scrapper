# Alembic's configuration, trimmed to what this project uses.
#
# The database URL is deliberately absent: it comes from TUBEDEPTH_DATABASE_URL
# or from the same default the application uses, resolved in migrations/env.py.
# A URL written here is one that gets committed, and then someone migrates the
# wrong database because the file said so.

[alembic]
script_location = migrations
prepend_sys_path = src
# Stated rather than inferred: alembic's legacy fallback splits this on
# spaces, commas and colons at once, which silently mangles any path holding
# one of those.
path_separator = os
# UTC and a date prefix, so `ls` orders revisions the way they ran.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
