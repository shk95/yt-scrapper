# The manifest docs/shared-postgres.md requires of every service on the shared
# database. This is the declaration other services and the database owner read;
# when reality and this file disagree, one of them is wrong and the audit
# queries in that document are how to find out which.
#
# `database` is deployment-specific and is therefore named by the deployment
# (TUBEDEPTH_DATABASE_URL), not here.

service: tubedepth
schema: tubedepth
roles:
  owner: tubedepth_owner
  migrator: tubedepth_migrator
  runtime: tubedepth_runtime

# None, and rule 10-13 of docs/shared-postgres.md is why it should stay that
# way: other services' identifiers (if ever stored) are plain values, validated
# through their APIs, never through a cross-schema FK or JOIN.
cross_service_dependencies: []

# None. The schema uses only core types; migrations are forbidden from
# CREATE EXTENSION by rule 8 regardless.
required_extensions: []

# The payload store: gzip blobs under TUBEDEPTH_DATA_DIR/payloads, keyed by
# content digest (immutable keys — the same digest is never rewritten with
# different bytes, which is rule 7's write protocol by construction). Artifact
# rows reference these files; a backup is a recovery SET of database plus this
# directory, never the database alone.
external_object_stores:
  - kind: filesystem
    path: ${TUBEDEPTH_DATA_DIR}/payloads
    write_protocol: content-addressed, write-then-record
    referenced_by: artifacts.digest

# docs/shared-postgres.md rule 4's formula, term by term — so the next
# person adding an API process or a rolling-deploy strategy has a line to
# update rather than a bare total to reverse-engineer:
#
#   service budget = max concurrent instances x per-instance pool ceiling
#                   + worker/scheduler/batch-only connections
#                   + service migration connections
#
# Steady state — one API process + one worker process, each holding a write
# engine and a read engine (src/tubedepth/database.py's `Database`, and its
# docstring for why the two engines are separate). The two processes are no
# longer symmetric, because the worker's write-engine pool is sized off
# `TUBEDEPTH_CONCURRENCY`, not the fixed default (`cli.work`,
# `database.py`'s `_write_pool_kwargs`):
#
#   API:    write engine (2+2=4) + read engine (2+2=4)              =  8
#   worker: write engine (concurrency+concurrency) + read engine (4)
#           = TUBEDEPTH_CONCURRENCY x 2 + 4
#           = 2 x 2 + 4 (deploy/tubedepth-worker.service's default 2)  =  8
#   steady-state total = 8 + 8                                        = 16
#
# The worker's write engine, not its read engine, is what needs the
# concurrency term: `Worker.drain` runs one claim thread and one
# lease-renewal thread per unit of concurrency (`worker.py`'s `pump` and
# `_holding_lease`), both taking sessions on the write engine, so up to
# 2 x concurrency simultaneous demands land on it — measured directly
# (`docs/status.md`) to serialize into batches once demand exceeds the pool,
# not merely inferred from the thread count. The read engine takes at most
# one session at a time (`Worker.reap`) and keeps the default ceiling.
#
# Worker/scheduler/batch-only connections — the worker is already counted
# above as one of the two processes; nothing here runs a separate scheduler
# or batch process, so this term is 0.
#
# Service migration connection — `tubedepth migrate` (migrations/env.py) opens
# exactly one connection through `poolclass=pool.NullPool`, for the duration
# of a deploy. +1.
#
# Rolling-deploy overlap — these are plain systemd user units
# (Restart=on-failure/always, not a blue-green or rolling strategy), so an old
# and a new instance are never both running against this database at once.
# +0, written down rather than left off: whoever changes that deployment
# shape owes this line an update, not a silent doubling of the steady-state
# term above it.
#
#   total = 16 + 0 + 1 + 0 = 17
#
# 17 <= 20, the number below, which is also the CONNECTION LIMIT
# deploy/postgres-bootstrap.sql sets on tubedepth_runtime — a miscount here
# is caught by the database itself, not only by this arithmetic. The 3 left
# over is the operational safety margin rule 4 asks for.
#
# 20 is a ceiling this service was granted by the fleet, not a number this
# manifest gets to raise on its own say-so (docs/shared-postgres.md rule 4:
# the budget is database-wide, Sigma(service budget) <= max_connections minus
# reserved connections minus margin — a service that discovers it wants more
# and edits its own declaration upward has not solved anything, it has moved
# the failure to whichever service happens to connect when the instance runs
# dry). TUBEDEPTH_CONCURRENCY=2 is therefore chosen backwards from 20, not
# forwards from what the rate controller could use — `docs/status.md` records
# a measured *useful* ceiling of 6 concurrent extractions (past that the
# bottleneck is not on this service's side), and 2 x 2 + 4 = 8 is what leaves
# room for the API's 8 and the existing 3-connection margin inside 20. That
# gap — 6 wanted, 2 affordable — is written up in docs/status.md as an open
# question for the fleet, not quietly absorbed by shipping a smaller number
# and saying nothing. Raising `TUBEDEPTH_CONCURRENCY` past 2 needs either a
# fleet-approved rise in this service's declared budget (both this file and
# the CONNECTION LIMIT below, kept in step by hand — nothing here reads the
# unit file to check) or a change that stops scaling the pool 1:1 with
# concurrency. See docs/status.md § "규정 적용" for the full accounting.
connection_budget: 20
