[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tubedepth"
# Read from `src/tubedepth/__init__.py` rather than written here.
#
# The version reaches three places at runtime — `tubedepth version`, the
# OpenAPI document and `/healthz` — all of which import it from the package.
# Repeating it in this file made a release two edits that could half-succeed,
# and the half that gets forgotten is the one nothing prints. A test asserts
# this stays dynamic.
dynamic = ["version"]
description = "An asynchronous job API that harvests the YouTube video, channel and discovery data the official Data API does not expose"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.9,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.28,<1",
  "typer>=0.12,<1",
  # Deliberately uncapped, unlike everything above it.
  #
  # Every YouTube breakage this project will ever have is fixed by upgrading
  # yt-dlp. An upper cap turns that fix from `uv lock --upgrade-package yt-dlp`
  # into "edit pyproject.toml first, then run the command", which is exactly the
  # friction you do not want at the moment extraction has stopped working.
  # The lock file still pins an exact version, so builds stay reproducible.
  "yt-dlp>=2026.7",
  # PostgreSQL is the only backend since the cutover (#15, docs/status.md) —
  # `Database` refuses any other dialect for the application's own connection.
  # This used to be the `postgres` extra so a SQLite-only checkout could skip
  # the compiled driver; there is no SQLite-only checkout left to serve.
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "basedpyright>=1.18,<2",
]

[project.scripts]
tubedepth = "tubedepth.cli:main"

[tool.hatch.version]
path = "src/tubedepth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tubedepth"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The plan is a historical document: it records what was approved on
# 2026-08-18, including code sketches that were never run and in several places
# turned out wrong. Reformatting it would edit the record — and a record that
# gets edited to match current conventions stops being evidence of what was
# actually decided. ruff formats Python blocks inside Markdown, so it has to be
# told.
#
# `docs/shared-postgres.md` is excluded for a related but distinct reason: it is
# a verbatim copy of a fleet-wide regulation several repositories hold. The point
# of a copy is that it can be replaced wholesale when the regulation is amended,
# and a local reformat makes every future replacement a diff to reconcile. How
# *this* repository applies the regulation is written in docs/status.md instead,
# which is where a local edit belongs.
extend-exclude = ["docs/plan.md", "docs/shared-postgres.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not live"` is load-bearing, not a preference. Every source in this
# project talks to YouTube, and a suite that actually does so is red on any
# datacenter address for reasons unrelated to the change under test. A check
# that is red for unrelated reasons is one people learn to ignore.
#
# `and not postgres` used to sit here too, deselecting the suite's only
# server-backed tests by default. Task 7 (issue #15 — "the tests move too")
# moved `database_url_for_tests` itself onto a real PostgreSQL server, which
# means every test through the `database` fixture needs one now, not just the
# handful marked `postgres` — deselecting the marker would deselect almost
# the whole suite. `tool/checks/test` (and so `just check`) now needs Docker;
# `tool/checks/prerequisite` says so.
addopts = "-q -m 'not live'"
asyncio_mode = "auto"
markers = [
  "live: reaches YouTube or a third-party service; never runs in CI. Use `just contract`.",
  # No longer a selection filter (every test needs the server now) — kept as
  # a label for the tests that check PostgreSQL's own structure (roles,
  # privileges, `alembic_version` placement) rather than merely running
  # against it, so `pytest -m postgres` can still single those out.
  "postgres: exercises PostgreSQL structure directly (roles, privileges, migrations), not just as a backing store.",
]

[tool.coverage.run]
source = ["tubedepth"]
