name: CI

# Runs the same three scripts the git hooks run.
#
# Hooks are per-clone configuration and easy to forget, so CI must repeat every
# check they perform rather than trusting that they ran. See
# project-scaffold decisions/002-hooks-are-opt-in-so-ci-must-backstop.md
#
# REQUIRE_NATIVE=1 turns tool/checks/prerequisite's "unverified on this host"
# exit 69 back into a failure, so the merge gate can never accept a change that
# was silently unchecked.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REQUIRE_NATIVE: 1

jobs:
  verify:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Format
        run: tool/checks/format

      - name: Lint
        run: tool/checks/lint

      # The suite is offline by construction: tests/conftest.py refuses to open
      # a socket for any test not marked `live`, and `live` is deselected by
      # pyproject's addopts. A GitHub runner is a datacenter address, so a
      # network-dependent suite here would be red for reasons that have nothing
      # to do with the diff.
      - name: Test
        run: tool/checks/test

  # The migration checks against the database this project is moving to. A
  # separate job because it needs a server: folding it into `verify` would make
  # every run wait on a container for checks that do not use one, and a red
  # PostgreSQL job would then be indistinguishable from a red lint.
  #
  # It is required all the same. A migration that applies on SQLite and fails on
  # PostgreSQL is exactly the failure this is here to catch, and it is only ever
  # discovered at deploy time by whoever is least able to fix it.
  postgres:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the major the deployment will run. A migration is checked
        # against a version or it is not checked.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: fleet
      TUBEDEPTH_TEST_POSTGRES_URL: postgresql+psycopg://tubedepth_migrator:check@localhost:5432/fleet
      TUBEDEPTH_TEST_POSTGRES_RUNTIME_URL: postgresql+psycopg://tubedepth_runtime:check-runtime@localhost:5432/fleet

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The same file a real deployment runs, so what CI checks is the shape
      # production has — the `search_path` in particular, which is what decides
      # whether this service's `alembic_version` lands in its own schema.
      - name: Bootstrap the roles and schema
        run: |
          psql -h localhost -U fleet -d fleet -v ON_ERROR_STOP=1 \
            -v password="'check'" -v runtime_password="'check-runtime'" -v database=fleet \
            -f deploy/postgres-bootstrap.sql
          # Harness only, and deliberately not in that file: the tests drop and
          # recreate the schema between cases. In production the service role
          # has no business creating schemas.
          psql -h localhost -U fleet -d fleet -c 'GRANT CREATE ON DATABASE fleet TO tubedepth_migrator'

      - name: Migrations
        run: tool/checks/postgres

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [verify, postgres]
    if: always()
    steps:
      # A stable job name for branch protection to require, so adding or
      # renaming a check above never means editing the protection rule.
      - name: Gate
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "verify did not succeed: ${{ needs.verify.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.postgres.result }}" != "success" ]; then
            echo "postgres did not succeed: ${{ needs.postgres.result }}" >&2
            exit 1
          fi
          echo "all required checks passed"
