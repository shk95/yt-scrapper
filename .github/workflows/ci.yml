name: CI

# Runs the same three scripts the git hooks run.
#
# Hooks are per-clone configuration and easy to forget, so CI must repeat every
# check they perform rather than trusting that they ran. See
# project-scaffold decisions/002-hooks-are-opt-in-so-ci-must-backstop.md
#
# REQUIRE_NATIVE=1 turns tool/checks/prerequisite's "unverified on this host"
# exit 69 back into a failure, so the merge gate can never accept a change that
# was silently unchecked.
#
# One job, not two, since Task 7 (issue #15 — "the tests move too"):
# `database_url_for_tests` names a schema on a real PostgreSQL server for
# nearly every test in the suite now, not just the handful that used to be
# marked `postgres` and run in a separate job. Format and lint do not need the
# server, but splitting them off to avoid a few seconds of container start-up
# would be a second job definition to keep in sync with the first for no
# benefit — `tool/checks/test` already needs Docker locally too.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REQUIRE_NATIVE: 1

jobs:
  verify:
    name: Format, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the major the deployment will run. A migration is checked
        # against a version or it is not checked.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: fleet
      TUBEDEPTH_TEST_POSTGRES_URL: postgresql+psycopg://tubedepth_migrator:check@localhost:5432/fleet
      TUBEDEPTH_TEST_POSTGRES_RUNTIME_URL: postgresql+psycopg://tubedepth_runtime:check-runtime@localhost:5432/fleet

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The same file a real deployment runs, so what CI checks is the shape
      # production has — the `search_path` in particular, which is what decides
      # whether this service's `alembic_version` lands in its own schema.
      - name: Bootstrap the roles and schema
        run: |
          psql -h localhost -U fleet -d fleet -v ON_ERROR_STOP=1 \
            -v password="'check'" -v runtime_password="'check-runtime'" -v database=fleet \
            -f deploy/postgres-bootstrap.sql
          # Harness only, and deliberately not in that file: the suite drops
          # and recreates a schema per test for isolation. In production the
          # service role has no business creating schemas.
          psql -h localhost -U fleet -d fleet -c 'GRANT CREATE ON DATABASE fleet TO tubedepth_migrator'

      - name: Format
        run: tool/checks/format

      - name: Lint
        run: tool/checks/lint

      # The suite is offline by construction: tests/conftest.py refuses to open
      # a socket for any test not marked `live`, and `live` is deselected by
      # pyproject's addopts — except to the PostgreSQL service container above,
      # which `refuse_outbound_network` allow-lists by address. A GitHub
      # runner is a datacenter address, so a network-dependent suite here
      # would be red for reasons that have nothing to do with the diff.
      #
      # `TUBEDEPTH_TEST_POSTGRES_URL` is already set (above), so
      # `tool/checks/test` uses this server rather than bringing up its own —
      # the same bootstrap file, so what is checked is the shape production
      # has, including a migration that applies on SQLite and fails on
      # PostgreSQL, which used to only be caught at deploy time.
      - name: Test
        run: tool/checks/test

  # The image and the compose example, which `verify` cannot cover: every
  # assertion in tests/test_compose.py is a file parse, on purpose (the suite
  # refuses outbound sockets and never talks to a daemon), so nothing there
  # would notice that the Dockerfile stopped building or that the stack no
  # longer comes up. Without this job that is discovered at release time.
  image:
    name: Image and compose
    runs-on: ubuntu-latest

    # No `services:` block, unlike `verify` above: the database this job needs
    # is the one the compose file's `local` profile brings up, which is the
    # thing under test. Bootstrapping it is deploy/postgres-initdb's job, not a
    # workflow step — the whole point of that wrapper is that a deployment and
    # CI run the same deploy/postgres-bootstrap.sql.
    env:
      # Interpolated by compose. Check values, and this is a throwaway
      # container on a runner that is destroyed afterwards — but they are still
      # passed as environment rather than written into any file.
      TUBEDEPTH_IMAGE: tubedepth:ci
      TUBEDEPTH_API_PORT: 8080
      TUBEDEPTH_DATABASE_URL: postgresql+psycopg://tubedepth_runtime:check-runtime@postgres:5432/fleet
      TUBEDEPTH_MIGRATOR_DATABASE_URL: postgresql+psycopg://tubedepth_migrator:check@postgres:5432/fleet
      TUBEDEPTH_LOCAL_SUPERUSER_PASSWORD: fleet
      TUBEDEPTH_LOCAL_MIGRATOR_PASSWORD: check
      TUBEDEPTH_LOCAL_RUNTIME_PASSWORD: check-runtime

    steps:
      - uses: actions/checkout@v7

      # No `astral-sh/setup-uv` here, unlike `verify`, and no
      # `actions/setup-python` either: nothing in this job runs uv or a runner
      # Python. The Dockerfile brings its own uv (pinned, from uv's published
      # image) and builds its own venv, which is the whole point — a step that
      # installed a second toolchain nobody calls would read as setup and do
      # nothing, which is worse than not being there.
      - name: Build the image
        run: docker build -t "$TUBEDEPTH_IMAGE" .

      # The cheapest possible proof that the image can run its entrypoint:
      # `ENTRYPOINT ["tubedepth"]`, so the argument is all that is passed. It
      # catches a broken venv, a missing source tree and a console script that
      # cannot import its package, none of which the build itself notices.
      - name: Smoke test the entrypoint
        run: |
          docker run --rm "$TUBEDEPTH_IMAGE" --help
          docker run --rm "$TUBEDEPTH_IMAGE" version

      # One line, rather than the committed example this file otherwise
      # mounts. The example's `channel`, `search` and `trending` directives
      # each fan out to a job per video they find — up to
      # TUBEDEPTH_LISTING_LIMIT of them — and a runner is a datacenter
      # address, which AGENTS.md is explicit is the kind YouTube bot-checks.
      # This job is about whether the stack comes up, and it should not also
      # be about what YouTube thinks of the runner.
      #
      # Not an *empty* list: `watch` refuses one (`_watch_pass`: a watcher
      # that watches nothing while reporting success is the failure the
      # command is shaped against), so it would exit non-zero and
      # `restart: unless-stopped` would turn this into a restart loop.
      - name: A one-line watch list, to keep the stack off YouTube's radar
        run: |
          printf 'video dQw4w9WgXcQ\n' > /tmp/watchlist.txt
          echo "TUBEDEPTH_WATCHLIST_FILE=/tmp/watchlist.txt" >> "$GITHUB_ENV"

      # `--profile local`, so the stack brings up its own PostgreSQL and
      # bootstraps it with the same file production runs. `--wait` blocks until
      # every service is healthy or has completed, which is what makes
      # `migrate` exiting non-zero — or the API failing its healthcheck — a
      # failure here rather than a later curl that times out for reasons
      # nobody can see.
      - name: Bring up the local-profile stack
        run: |
          docker compose -f deploy/docker-compose.yml --profile local up -d --wait

      - name: Check /healthz
        run: |
          set -e
          code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' \
            "http://127.0.0.1:${TUBEDEPTH_API_PORT}/healthz")
          cat /tmp/healthz.json
          echo
          test "$code" = "200"

      # Runs even when a step above failed, which is the only moment the logs
      # are worth anything: a stack that did not come up leaves no other trace.
      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile local logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile local down -v

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [verify, image]
    if: always()
    steps:
      # A stable job name for branch protection to require, so adding or
      # renaming a check above never means editing the protection rule.
      - name: Gate
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "verify did not succeed: ${{ needs.verify.result }}" >&2
            exit 1
          fi
          if [ "${{ needs.image.result }}" != "success" ]; then
            echo "image did not succeed: ${{ needs.image.result }}" >&2
            exit 1
          fi
          echo "all required checks passed"
