name: Secret scan

# The check that cannot be skipped.
#
# The pre-commit hook scans too, but hooks are per-clone configuration and easy
# to forget, so a clone can commit with no scanning whatsoever. See
# decisions/002-hooks-are-opt-in-so-ci-must-backstop.md
#
# Merge this job into an existing CI workflow rather than running it as its own,
# if you already have one.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a credential is only really a problem once it is in a
      # commit, and it stays there after the file is deleted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed directly rather than via a third-party action: fewer moving
      # parts in the supply chain, and no licence requirement for organisation
      # accounts. Bump the version deliberately.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan history
        run: gitleaks git --redact --no-banner
