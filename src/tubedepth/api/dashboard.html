<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tubedepth</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #fff; --line: #e4e4e1; --ink: #1a1a18;
    --dim: #6b6b66; --accent: #2f6f4f;
    --ok: #2f6f4f; --warn: #8a6d1f; --bad: #a03434; --idle: #8a8a84;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2124; --line: #2e3135; --ink: #e8e8e4;
      --dim: #9a9a93; --accent: #7fc9a0;
      --ok: #7fc9a0; --warn: #d8b45c; --bad: #e08585; --idle: #757570;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .grow { flex: 1; }
  input, select, button {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { padding: 20px; display: grid; gap: 18px; max-width: 1400px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
    margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center;
  }
  .body { padding: 14px 16px; overflow-x: auto; }
  .counts { display: flex; gap: 26px; flex-wrap: wrap; }
  .count b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .count span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 12px; padding: 6px 10px 6px 0; }
  td { padding: 5px 10px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.mono, th.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .status { font-weight: 600; }
  .healthy { color: var(--ok); } .broken, .blocked { color: var(--bad); }
  .degraded, .stale { color: var(--warn); } .unknown { color: var(--idle); }
  .succeeded { color: var(--ok); } .failed { color: var(--bad); }
  .running { color: var(--accent); } .queued, .cancelled { color: var(--dim); }
  .note { color: var(--dim); padding: 10px 0; }
  .err { color: var(--bad); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
  .bars div { flex: 1; background: var(--accent); opacity: .75; min-height: 1px; border-radius: 1px 1px 0 0; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; }
  .pill { font-size: 12px; color: var(--dim); }
</style>

<header>
  <h1>tubedepth <span id="version"></span></h1>
  <div class="grow"></div>
  <span class="pill" id="updated"></span>
  <input id="key" type="password" placeholder="X-API-Key" size="26" autocomplete="off">
  <button id="save">use key</button>
  <button id="refresh">refresh</button>
</header>

<main>
  <section>
    <h2>Queue</h2>
    <div class="body"><div class="counts" id="counts"></div></div>
  </section>

  <section>
    <h2>Sources <span class="pill">what each kind has been doing</span></h2>
    <div class="body"><table id="health"></table></div>
  </section>

  <section>
    <h2>Completed per hour <span class="pill" id="throughput-note"></span></h2>
    <div class="body"><div class="bars" id="bars"></div></div>
  </section>

  <section>
    <h2>Records</h2>
    <div class="filters">
      <select id="table"><option value="jobs">jobs</option><option value="artifacts">artifacts</option></select>
      <select id="kind"><option value="">any kind</option></select>
      <select id="state">
        <option value="">any state</option><option>queued</option><option>running</option>
        <option>succeeded</option><option>failed</option><option>cancelled</option>
      </select>
      <select id="range">
        <option value="1">last hour</option><option value="24" selected>last 24 hours</option>
        <option value="168">last 7 days</option><option value="">all time</option>
      </select>
      <input id="target" placeholder="target" size="16">
      <button id="apply">apply</button>
      <button id="more">load more</button>
    </div>
    <div class="body"><table id="records"></table></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let cursor = null, rows = [];

const key = () => localStorage.getItem("tubedepth-key") || "";
$("key").value = key();
$("save").onclick = () => { localStorage.setItem("tubedepth-key", $("key").value.trim()); load(); };
$("refresh").onclick = () => load();
$("apply").onclick = () => { cursor = null; rows = []; loadRecords(); };
$("more").onclick = () => loadRecords();
for (const id of ["table", "kind", "state", "range"]) {
  $(id).onchange = () => { cursor = null; rows = []; loadRecords(); };
}

async function api(path) {
  const response = await fetch(path, { headers: { "X-API-Key": key() } });
  if (response.status === 401) throw new Error("no key, or the key was rejected");
  if (!response.ok) throw new Error(`${path} answered ${response.status}`);
  return response.json();
}

const ago = (iso) => {
  if (!iso) return "—";
  const seconds = (Date.now() - new Date(iso)) / 1000;
  if (seconds < 90) return `${Math.round(seconds)}s ago`;
  if (seconds < 5400) return `${Math.round(seconds / 60)}m ago`;
  if (seconds < 172800) return `${Math.round(seconds / 3600)}h ago`;
  return `${Math.round(seconds / 86400)}d ago`;
};
const bytes = (n) => n == null ? "—"
  : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KiB` : `${(n / 1048576).toFixed(1)} MiB`;
const escape = (value) => String(value ?? "").replace(/[<>&"]/g, (c) =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

async function loadHealth() {
  const health = await api("/healthz");
  $("version").textContent = health.version;
  $("counts").innerHTML = [
    ["queued", health.queued], ["running", health.running],
  ].map(([label, value]) => `<div class="count"><b>${value}</b><span>${label}</span></div>`).join("");

  $("health").innerHTML =
    "<tr><th>kind</th><th>status</th><th>fails</th><th>last success</th><th>last error</th></tr>" +
    health.sources.map((source) => `<tr>
      <td class="mono">${escape(source.kind)}</td>
      <td class="status ${source.status}">${source.status}</td>
      <td>${source.consecutive_failures || ""}</td>
      <td>${ago(source.last_success_at)}</td>
      <td class="err">${escape(source.last_error_code || "")}</td>
    </tr>`).join("");

  if (!$("kind").dataset.filled) {
    $("kind").innerHTML = '<option value="">any kind</option>' +
      health.sources.map((source) => `<option>${escape(source.kind)}</option>`).join("");
    $("kind").dataset.filled = "1";
  }
}

function drawThroughput(jobs) {
  const buckets = new Array(24).fill(0);
  const now = Date.now();
  let counted = 0;
  for (const job of jobs) {
    if (!job.finished_at) continue;
    const hours = (now - new Date(job.finished_at)) / 3600000;
    if (hours >= 0 && hours < 24) { buckets[23 - Math.floor(hours)]++; counted++; }
  }
  const peak = Math.max(1, ...buckets);
  $("bars").innerHTML = buckets
    .map((value, index) => `<div style="height:${(value / peak) * 100}%" title="${23 - index}h ago: ${value}"></div>`)
    .join("");
  $("throughput-note").textContent = `${counted} finished in the last 24 h, peak ${peak}/h`;
}

function query() {
  const parameters = new URLSearchParams();
  if ($("kind").value) parameters.set("kind", $("kind").value);
  if ($("target").value.trim()) parameters.set("target", $("target").value.trim());
  if ($("table").value === "jobs" && $("state").value) parameters.set("state", $("state").value);
  const hours = $("range").value;
  if (hours) parameters.set("since", new Date(Date.now() - hours * 3600000).toISOString());
  if (cursor) parameters.set("cursor", cursor);
  parameters.set("limit", "100");
  return parameters.toString();
}

async function loadRecords() {
  const table = $("table").value;
  $("state").disabled = table !== "jobs";
  const page = await api(`/v1/${table}?${query()}`);
  cursor = page.cursor;
  $("more").disabled = !cursor;
  rows = rows.concat(table === "jobs" ? page.jobs : page.artifacts);

  if (!rows.length) { $("records").innerHTML = '<tr><td class="note">nothing in this range</td></tr>'; return; }

  $("records").innerHTML = table === "jobs"
    ? "<tr><th>id</th><th>kind</th><th>target</th><th>state</th><th>try</th><th>size</th><th>created</th><th>error</th></tr>" +
      rows.map((job) => `<tr>
        <td class="mono">${escape(job.job_id.slice(0, 8))}</td>
        <td class="mono">${escape(job.kind)}</td>
        <td class="mono">${escape(job.target)}</td>
        <td class="status ${job.state}">${job.state}</td>
        <td>${job.attempt_count}</td>
        <td>${bytes(job.payload_bytes)}</td>
        <td>${ago(job.created_at)}</td>
        <td class="err">${escape(job.error_code || "")}${job.error_message ? ": " + escape(job.error_message.slice(0, 70)) : ""}</td>
      </tr>`).join("")
    : "<tr><th>kind</th><th>target</th><th>size</th><th>collected</th><th>fresh until</th><th class='mono'>digest</th></tr>" +
      rows.map((artifact) => `<tr>
        <td class="mono">${escape(artifact.kind)}</td>
        <td class="mono">${escape(artifact.target)}</td>
        <td>${bytes(artifact.byte_count)}</td>
        <td>${ago(artifact.fetched_at)}</td>
        <td>${new Date(artifact.fresh_until) > new Date() ? ago(artifact.fresh_until).replace(" ago", " left") : "stale"}</td>
        <td class="mono">${escape(artifact.digest.slice(0, 12))}</td>
      </tr>`).join("");
}

async function load() {
  try {
    await loadHealth();
    cursor = null; rows = [];
    await loadRecords();
    if ($("table").value === "jobs") drawThroughput(rows);
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (error) {
    $("updated").innerHTML = `<span class="err">${escape(error.message)}</span>`;
  }
}

load();
setInterval(load, 15000);
</script>
